name: VntApp

on:
  push:
    branches:
      - flutter
  workflow_dispatch:
    inputs:
      rebuild_android_so:
        description: '是否重新打包安卓so库？'
        required: false
        type: boolean
        default: false
      release_version:
        description: '发布版本号，留空则只构建不发布'
        required: false
        type: string
        default: ''
      release_type:
        description: '发布类型'
        required: false
        type: choice
        default: rel
        options:
          - rel
          - pre

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.NAME }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - NAME: vntApp-android
            OS: ubuntu-latest
            flutter-version: 3.22.0
          - NAME: vntApp-windows
            OS: windows-2022
            flutter-version: 3.24.5
          - NAME: vntApp-macOS
            OS: macos-latest
            flutter-version: 3.24.5
          - NAME: vntApp-IOS
            OS: macos-14
            flutter-version: 3.24.5
          - NAME: vntApp-linux-x86_64
            OS: ubuntu-latest
            flutter-version: 3.24.5
            DOCKER_PLATFORM: linux/amd64
            DOCKER_IMAGE: ubuntu:18.04
            APPIMAGE_ARCH: x86_64
            BUNDLE_DIR: build/linux/x64/release/bundle
    runs-on: ${{ matrix.OS }}
    steps:
      - uses: actions/checkout@main
        with:
         ref: flutter

      - name: 更新 pubspec.yaml 版本号
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version != '' }}
        shell: bash
        run: |
          VERSION="${{ inputs.release_version }}"
          VERSION="${VERSION#v}"
          perl -i -pe "s/^version: .*/version: $VERSION/" pubspec.yaml
          echo "pubspec version → $VERSION"

      - name: 设置 Xcode 版本
        if: matrix.NAME == 'vntApp-IOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
        
      - name: 设置JDK环境
        if: matrix.NAME == 'vntApp-android'
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: 17
          
      - name: 设置NDK环境
        if: matrix.NAME == 'vntApp-android' && github.event.inputs.rebuild_android_so == 'true'
        run: |
           wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
           unzip -q android-ndk-r26d-linux.zip -d /opt/ndk

      - name: 设置Flutter环境
        if: "!startsWith(matrix.NAME, 'vntApp-linux')"
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}

      - name: 固定 Rust 版本 1.77.2
        if: "!startsWith(matrix.NAME, 'vntApp-linux')"
        shell: bash
        run: |
          rustup set auto-self-update disable
          rustup toolchain install 1.77.2
          rustup default 1.77.2
          rustup component add rust-src --toolchain 1.77.2
          rustc -V

      - name: 缓存 Flutter 依赖
        if: matrix.NAME == 'vntApp-macOS'
        uses: actions/cache@main
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}

      - name: 缓存 Flutter / Pub / Gradle（Windows 7 引擎版）
        if: matrix.NAME == 'vntApp-windows'
        uses: actions/cache@main
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ runner.tool_cache }}/flutter
          key: windows-flutter-win7-engine-${{ matrix.flutter-version }}-${{ hashFiles('pubspec.lock') }}

      - name: 缓存 Flutter / Pub / Gradle（标准版）
        if: matrix.NAME != 'vntApp-windows'
        uses: actions/cache@main
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ runner.tool_cache }}/flutter
          key: ${{ runner.os }}-flutter-${{ matrix.flutter-version }}-${{ hashFiles('pubspec.lock') }}

      - name: 判断是否已应用 Windows 7 引擎
        if: matrix.NAME == 'vntApp-windows'
        id: win7_engine
        shell: pwsh
        run: |
          $flag = "C:/hostedtoolcache/windows/flutter/stable-${{ matrix.flutter-version }}-x64/.win7_engine_applied"
          echo "applied=$(Test-Path $flag)" >> $Env:GITHUB_OUTPUT

      - name: 替换 Flutter 引擎为支持 Windows 7 的版本
        if: matrix.NAME == 'vntApp-windows' && steps.win7_engine.outputs.applied != 'true'
        shell: pwsh
        run: |
          flutter precache --windows
          Invoke-WebRequest -Uri "https://github.com/lmq8267/VntApp/raw/refs/heads/flutter/.github/patches/windows-x64-release.zip" -OutFile ".github/patches/windows-x64-release.zip"
          Expand-Archive -Path ".github/patches/windows-x64-release.zip" -DestinationPath "windows-x64-release"
          Copy-Item -Path "windows-x64-release/*" -Destination "C:/hostedtoolcache/windows/flutter/stable-${{ matrix.flutter-version }}-x64/bin/cache/artifacts/engine/windows-x64-release/" -Recurse -Force
          New-Item -ItemType File -Path "C:/hostedtoolcache/windows/flutter/stable-${{ matrix.flutter-version }}-x64/.win7_engine_applied" -Force
            
      - name: 打补丁以启用 Dropdown Menu 过滤支持
        if: matrix.NAME == 'vntApp-windows' && steps.win7_engine.outputs.applied != 'true'
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff || true

      - name: Install Android rust target
        if: matrix.NAME == 'vntApp-android'
        run: |
           rustup target add aarch64-linux-android
           rustup target add armv7-linux-androideabi
           rustup target add x86_64-linux-android
           rustup target add i686-linux-android
           sed -i 's|main|Android|' rust/Cargo.toml

      - name: 是否重新打包安卓so库？
        if: matrix.NAME == 'vntApp-android' && github.event.inputs.rebuild_android_so == 'true'
        run: |
           cd rust && rm -rf .cargo/config
           export PATH=/opt/ndk/android-ndk-r26d:/opt/ndk/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
           cat >>./.cargo/config <<'EOF'
           [target.armv7-linux-androideabi]
           ar = "/opt/ndk/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
           linker = "/opt/ndk/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
           [target.aarch64-linux-android]
           ar = "/opt/ndk/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
           linker = "/opt/ndk/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
           [target.i686-linux-android]
           ar = "/opt/ndk/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
           linker = "/opt/ndk/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android21-clang"
           [target.x86_64-linux-android]
           ar = "/opt/ndk/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
           linker = "/opt/ndk/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"
           EOF
           for target in aarch64-linux-android x86_64-linux-android i686-linux-android armv7-linux-androideabi; do
             echo "Building $target"
             cargo build --target $target --release
             mkdir -p ../android/app/src/main/jniLibs/${target/aarch64-linux-android/arm64-v8a}
             mv -f target/$target/release/*.so ../android/app/src/main/jniLibs/${target/aarch64-linux-android/arm64-v8a}
             cargo clean
           done

      - name: 上传 jniLibs
        if: matrix.NAME == 'vntApp-android' && github.event.inputs.rebuild_android_so == 'true'
        uses: actions/upload-artifact@main
        with:
          name: android-jniLibs
          path: android/app/src/main/jniLibs/

      - name: 构建 Android vntAPP
        if: matrix.NAME == 'vntApp-android'
        run: |
         flutter clean && flutter pub get
         flutter build apk --release
         mv build/app/outputs/apk/release/app-release.apk app-release.apk
         if [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
           echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
           keystore_path="keystore.jks"
           password="${{ secrets.KEYSTORE_PASSWORD }}"
         else
           keystore_path="keystore.jks"
           password=vntAPP
           keytool -genkeypair -v -keystore "$keystore_path" -storepass "$password" -alias key -keypass "$password" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android, OU=Android, O=Android, L=BeiJing, ST=BeiJing, C=CN"
         fi
         /usr/local/lib/android/sdk/build-tools/34.0.0/apksigner sign \
           --ks "$keystore_path" --ks-key-alias key --ks-pass pass:$password \
           --key-pass pass:$password --out vntApp-android.apk --in app-release.apk \
           --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled true

      - name: 构建 Windows vntAPP
        if: matrix.NAME == 'vntApp-windows'
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release -v
          # ✅ 关键修复：不切换目录，直接打包
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath vntApp-windows.zip -Force

      - name: macOS 同步 Rust API 参数
        if: matrix.NAME == 'vntApp-macOS'
        shell: bash
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: 修复 tun-rs 代码（macOS/iOS）
        if: matrix.NAME == 'vntApp-macOS' || matrix.NAME == 'vntApp-IOS'
        shell: bash
        run: |
          cd rust && cargo fetch || true
          TUN_FILE=$(find ~/.cargo/registry/src -name "mod.rs" -path "*/tun-rs-*/src/platform/macos/tap/mod.rs" 2>/dev/null | head -1)
          if [ -n "$TUN_FILE" ]; then
            sed -i '' '35a\
          use std::mem::size_of;' "$TUN_FILE"
          fi
          cd ..

      - name: 构建 macOS 应用
        if: matrix.NAME == 'vntApp-macOS'
        run: |
          flutter pub get
          flutter build macos --release -v
          APP_PATH="build/macos/Build/Products/Release/vnt_app.app"
          DMG_PATH="vnt_APP.dmg"
          chmod +x "$APP_PATH/Contents/MacOS/vnt_app"
          codesign --force --deep --timestamp=none --preserve-metadata=identifier,entitlements,flags --sign - "$APP_PATH"
          chmod +x macos/create_dmg.sh
          bash macos/create_dmg.sh "$APP_PATH" "$DMG_PATH"

      - name: 构建 IPA
        if: matrix.NAME == 'vntApp-IOS'
        run: |
          set -e
          rustup target add aarch64-apple-ios
          flutter clean && flutter pub get
          cd ios && pod install --repo-update && cd ..
          flutter build ios --release --no-codesign -v
          mkdir -p build/ios/iphoneos/Payload
          mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd ${{ github.workspace }}
          zip -r build/ios/iphoneos/vntAPP.ipa build/ios/iphoneos/Payload

      - name: 设置 QEMU（Linux arm64 跨架构）
        if: startsWith(matrix.NAME, 'vntApp-linux')
        uses: docker/setup-qemu-action@master

      - name: 构建 Linux AppImage（Docker Ubuntu 18.04）
        if: startsWith(matrix.NAME, 'vntApp-linux')
        run: |
          chmod +x linux/build_linux_appimage.sh
          docker run --rm --platform ${{ matrix.DOCKER_PLATFORM }} \
            -v "${{ github.workspace }}:/workspace" \
            -v "${HOME}/.pub-cache:/root/.pub-cache" \
            -e PUB_CACHE=/root/.pub-cache \
            -e APPIMAGETOOL_ARCH=${{ matrix.APPIMAGE_ARCH }} \
            -w /workspace \
            ${{ matrix.DOCKER_IMAGE }} \
            bash /workspace/linux/build_linux_appimage.sh \
              ${{ matrix.BUNDLE_DIR }} ${{ matrix.APPIMAGE_ARCH }}

      - name: Archive artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ matrix.NAME }}
          path: |
            ${{ matrix.NAME == 'vntApp-android' && 'vntApp-android.apk' || '' }}
            ${{ matrix.NAME == 'vntApp-windows' && 'vntApp-windows.zip' || '' }}
            ${{ matrix.NAME == 'vntApp-macOS' && 'vnt_APP.dmg' || '' }}
            ${{ matrix.NAME == 'vntApp-IOS' && 'build/ios/iphoneos/vntAPP.ipa' || '' }}
            ${{ matrix.NAME == 'vntApp-linux-x86_64' && 'vntApp-linux-x86_64.AppImage' || '' }}

  deploy:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: 准备发布文件
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          copy_asset() {
            local source="$1"
            local target="$2"
            if [ -f "$source" ]; then
              cp "$source" "release-assets/$target"
              echo "已准备: $target"
            else
              echo "跳过，构建产物不存在: $source"
            fi
          }

          copy_asset "artifacts/vntApp-android/vntApp-android.apk" "vntApp-android.apk"
          copy_asset "artifacts/vntApp-linux-x86_64/vntApp-linux-x86_64.AppImage" "vntApp-linux-x86_64.AppImage"
          copy_asset "artifacts/vntApp-IOS/vntAPP.ipa" "vntApp-ios.ipa"
          copy_asset "artifacts/vntApp-macOS/vnt_APP.dmg" "vntApp-mac.dmg"
          copy_asset "artifacts/vntApp-windows/vntApp-windows.zip" "vntApp-windows.zip"

          echo "发布文件列表:"
          find release-assets -maxdepth 1 -type f -print | sort

          sudo timedatectl set-timezone "Asia/Shanghai"
          echo "build_time=$(TZ=UTC-8 date '+%Y年%m月%d日%H:%M:%S' | jq -sRr @uri)" >> $GITHUB_ENV
          echo "build_tag=${{ startsWith(inputs.release_version, 'v') && inputs.release_version || format('v{0}', inputs.release_version) }}" >> $GITHUB_ENV

          if ! find release-assets -maxdepth 1 -type f | grep -q .; then
            echo "没有可发布的成功构建产物"
            exit 1
          fi

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(inputs.release_version, 'v') && inputs.release_version || format('v{0}', inputs.release_version) }}
          body: |
            > ### ![](https://img.shields.io/badge/%E7%BC%96%E8%AF%91%E6%97%B6%E9%97%B4-${{ env.build_time }}-8267?logo=github&labelColor=%E9%A1%BB)![](https://img.shields.io/github/downloads/${{ github.repository }}/${{ env.build_tag }}/total?label=%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&logo=github) 
          prerelease: ${{ inputs.release_type == 'pre' }}
          make_latest: ${{ inputs.release_type == 'rel' }}
          files: release-assets/*
